[project]
name = "nostradamus-research"
version = "0.1.0"
description = "Historical translation calibration framework for sixteenth-century French and Renaissance Latin (Milestone 1)."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Michael Minto" }]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "sacrebleu>=2.4",
]

[project.optional-dependencies]
# Real AI providers. Installing these never triggers API calls; a paid run
# additionally requires config/providers.yaml, an environment variable and
# the --allow-paid-api CLI flag.
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
providers = ["anthropic>=0.40", "openai>=1.50"]
# Neural semantic metric. Heavy (PyTorch); deliberately isolated and never
# installed in CI or required by the default test suite.
comet = ["unbabel-comet>=2.2"]

[project.scripts]
nr = "nostradamus_research.cli:app"
nostradamus-research = "nostradamus_research.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "types-jsonschema>=4.21",
    "pandas-stubs>=2.2",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nostradamus_research"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PT"]
ignore = [
    # Historical texts legitimately contain long s, ligatures and other
    # "confusable" Unicode characters.
    "RUF001", "RUF002", "RUF003",
    # Typer's idiom puts typer.Option(...) calls in argument defaults.
    "B008",
    # Line length is enforced by `ruff format`; remaining long lines are
    # user-facing message strings and tables that read better unwrapped.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Compact multi-condition asserts and broad raises are acceptable in tests.
"tests/**" = ["N802", "N806", "PT018", "PT011"]
# Version guard must remain valid syntax on old interpreters to print a helpful message.
"scripts/bootstrap.py" = ["UP036"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
files = ["src"]
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["sacrebleu.*", "sklearn.*", "scipy.*", "comet.*", "anthropic.*", "openai.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not external'"
markers = [
    "integration: multi-module or CLI tests (offline)",
    "external: requires optional heavy dependencies, network or API credentials; excluded by default",
]
filterwarnings = ["ignore::DeprecationWarning:sacrebleu.*"]
